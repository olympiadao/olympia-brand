<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Scoped fontconfig for rendering Olympia brand assets.

  Makes the vendored fonts in this directory discoverable WITHOUT installing them
  system-wide. Used by pointing FONTCONFIG_FILE at this file:

      FONTCONFIG_FILE="$PWD/fonts/fonts.conf" inkscape ...

  `prefix="relative"` resolves the directory relative to THIS file, so the config
  is portable across machines and CI with no absolute paths in it.
-->
<fontconfig>
  <!-- The vendored brand fonts (Inter, JetBrains Mono) — the ONLY fonts visible. -->
  <dir prefix="relative">.</dir>

  <!-- Deliberately hermetic: system fonts are NOT included.

       If /etc/fonts/fonts.conf were included, a system-installed copy of a brand
       font could win the match over the vendored file, and renders would differ
       per machine while looking correct on each one. Excluding it guarantees
       every render — local or CI — uses exactly these files.

       Note the consequence: fontconfig always returns a best match, so a family
       that is NOT vendored here silently resolves to one of these files rather
       than failing loudly. That is why the aliases below are not optional. -->

  <!-- The vendored file registers its family as "Inter Variable", NOT "Inter".
       Without this alias, `Inter` matches nothing and fontconfig substitutes the
       nearest available file — which, in a directory holding one sans and one
       mono, was JetBrains Mono. The card still renders, in the wrong typeface.

       This is not hypothetical. On the system fontconfig the same gap resolved
       `Inter` to Noto Sans, and the share cards committed to this repository
       were rendered that way: not in the brand typeface at all, and nothing
       reported a problem because a best match always succeeds. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Inter</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Inter Variable</string></edit>
  </match>

  <!-- MEASURED LIMITATION, do not spend time re-attempting it.

       The rule above works: with it, `Inter` resolves to InterVariable.ttf;
       without it, to JetBrainsMono[wght].ttf. Named families bind.

       The SAME rule written for a generic family does NOT bind in a hermetic
       config. `sans-serif`, `system-ui` and `monospace` all still fall through
       to best-match. Five syntaxes were tried and all five failed identically:
       match/assign, match/prepend, alias/prefer, alias/accept, and
       alias binding="strong". This is not a syntax error to fix.

       So the fallback entries in a font stack are NOT reliably mapped here, and
       the guard is placed elsewhere: scripts/render-og.sh resolves every family
       named in every card and fails loudly if one does not land on a vendored
       file. A card must therefore name a real vendored family FIRST — the
       generic fallbacks in its stack exist for browsers, not for this render. -->


</fontconfig>
